_min_copier_version: "9.0.0"
_subdirectory: template

_jinja_extensions:
  - jinja2.ext.do

# Skip overwriting these on `copier update` if they already exist
_skip_if_exists:
  - "CHANGELOG.md"

# Conditionally exclude files based on answers
_exclude:
  - "{% if 'oss' not in distributions.split() %}src/lib/github-updater.lua{% endif %}"
  - "{% if 'oss' not in distributions.split() and 'version' not in vendor_modules.split() %}vendor/version.lua{% endif %}"
  - "{% if 'oss' not in distributions.split() %}.github/workflows/release.yml{% endif %}"
  - "{% if 'drivercentral' not in distributions.split() and 'drivercentral-dev' not in distributions.split() %}vendor/cloud-client-byte.lua{% endif %}"
  - "{% if 'json' not in vendor_modules.split() %}vendor/JSON.lua{% endif %}"
  - "{% if 'deferred' not in vendor_modules.split() %}vendor/deferred.lua{% endif %}"
  - "{% if 'drivers-common-public' not in vendor_modules.split() %}vendor/drivers-common-public{% endif %}"
  - "{% if 'xml' not in vendor_modules.split() %}vendor/xml{% endif %}"
  - "{% if 'bitn' not in vendor_modules.split() %}vendor/bitn.lua{% endif %}"
  - "{% if 'crypto' not in vendor_modules.split() %}vendor/crypto.lua{% endif %}"
  - "{% if 'bthome' not in vendor_modules.split() %}vendor/bthome.lua{% endif %}"
  - "{% if 'noiseprotocol' not in vendor_modules.split() %}vendor/noiseprotocol.lua{% endif %}"
  - "{% if 'protobuf' not in vendor_modules.split() %}vendor/protobuf.lua{% endif %}"
  - "{% if 'bindings' not in lib_modules.split() %}src/lib/bindings.lua{% endif %}"
  - "{% if 'conditionals' not in lib_modules.split() %}src/lib/conditionals.lua{% endif %}"
  - "{% if 'events' not in lib_modules.split() %}src/lib/events.lua{% endif %}"
  - "{% if 'http' not in lib_modules.split() %}src/lib/http.lua{% endif %}"
  - "{% if 'lru' not in lib_modules.split() %}src/lib/lru.lua{% endif %}"
  - "{% if 'persist' not in lib_modules.split() %}src/lib/persist.lua{% endif %}"
  - "{% if 'values' not in lib_modules.split() %}src/lib/values.lua{% endif %}"

project_name:
  type: str
  help: "Project name (e.g., control4-esphome)"

project_description:
  type: str
  help: "Short project description"
  default: "A Control4 driver"

github_org:
  type: str
  help: "GitHub organization"

distributions:
  type: str
  help: "Space-separated build distributions (e.g., 'drivercentral oss')"
  default: "drivercentral oss"

readme_driver_slug:
  type: str
  help: "Driver slug used for README docs (e.g., 'esphome', 'mqtt_broker', 'home_connect')"

readme_build:
  type: str
  help: "Build distribution used to generate README (e.g., 'oss', 'drivercentral')"
  default: "oss"

primary_color:
  type: str
  help: "Primary hex color for documentation headings (e.g., '#17BCF2')"
  default: "#109EFF"

vendor_modules:
  type: str
  help: "Space-separated vendor modules (available: json deferred drivers-common-public xml bitn crypto bthome noiseprotocol protobuf). Note: the crypto/noiseprotocol/protobuf/bthome bundles are core builds that require bitn on the path; include bitn alongside them (crypto also for noiseprotocol)."
  default: "json deferred drivers-common-public xml"

lib_modules:
  type: str
  help: "Space-separated lib modules (available: bindings conditionals events http lru persist values)"
  default: "bindings conditionals events http lru persist values"