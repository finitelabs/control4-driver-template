_min_copier_version: "9.0.0"
_subdirectory: template

_jinja_extensions:
  - jinja2.ext.do

# Skip overwriting these on `copier update` if they already exist
_skip_if_exists:
  - "CHANGELOG.md"
  # Seeded with the keys the template lib needs; drivers extend it.
  - "src/constants.lua"
  # Seeded with the build secrets the template passes; drivers add their own.
  - ".env.default"
  # The icon template, copied once; each driver makes it its own.
  - "resources/Driver Icons.sketch"
  # The DriverCentral marketing set, seeded once; each driver fills in its own.
  - "resources/drivercentral/**"

# Conditionally exclude files based on answers
_exclude:
  - "{% if not stale_issues %}.github/workflows/stale.yml{% endif %}"
  - "{% if 'bitn' not in vendor_modules.split() %}vendor/bitn.lua{% endif %}"
  - "{% if 'crypto' not in vendor_modules.split() %}vendor/crypto.lua{% endif %}"
  - "{% if 'bthome' not in vendor_modules.split() %}vendor/bthome.lua{% endif %}"
  - "{% if 'noiseprotocol' not in vendor_modules.split() %}vendor/noiseprotocol.lua{% endif %}"
  - "{% if 'protobuf' not in vendor_modules.split() %}vendor/protobuf.lua{% endif %}"
  - "{% if 'oauth' not in vendor_modules.split() %}vendor/drivers-common-public/module/auth_code_grant.lua{% endif %}"
  - "{% if 'oauth' not in vendor_modules.split() %}vendor/drivers-common-public/global/make_short_link.lua{% endif %}"
  - "{% if 'oauth' not in vendor_modules.split() %}test/test_oauth_auth_code_grant.lua{% endif %}"
  - "{% if 'oauth' not in vendor_modules.split() %}test/test_oauth_short_link.lua{% endif %}"
  - "{% if 'expressions' not in vendor_modules.split() %}src/lib/expressions.lua{% endif %}"
  - "{% if 'expressions' not in vendor_modules.split() %}src/lib/expression-sandbox.lua{% endif %}"
  - "{% if 'expressions' not in vendor_modules.split() %}test/test_expressions.lua{% endif %}"
  - "{% if not cloud_diagnostics %}src/lib/diagnostics.lua{% endif %}"
  - "{% if not cloud_diagnostics %}test/test_diagnostics_reporting.lua{% endif %}"
  - "{% if not cloud_diagnostics %}test/test_diagnostics_scrub.lua{% endif %}"

project_name:
  type: str
  help: "Project name (e.g., control4-esphome)"

project_description:
  type: str
  help: "Short project description"
  default: "A Control4 driver"

github_org:
  type: str
  help: "GitHub organization"

dc_pid:
  type: int
  help: "DriverCentral product id, from the product's page in the vendor panel. 0 until the product exists, and a DriverCentral build stops itself until then."
  default: 0
  validator: "{% if dc_pid < 0 %}Must be 0 or a DriverCentral product id{% endif %}"

readme_driver_slug:
  type: str
  help: "Driver slug used for README docs (e.g., 'esphome', 'mqtt_broker', 'home_connect')"

readme_build:
  type: str
  help: "Build distribution used to generate README (e.g., 'oss', 'drivercentral')"
  default: "oss"

primary_color:
  type: str
  help: "Primary hex color for documentation headings (e.g., '#17BCF2')"
  default: "#109EFF"

icon_style:
  type: str
  help: "Control4 icon artboard `make icons` exports from resources/Driver Icons.sketch"
  choices:
    Shadow Shaped: shaped
    Shadow Square: square
  default: shaped

vendor_modules:
  type: str
  help: "Space-separated optional vendor modules (available: bitn crypto bthome noiseprotocol protobuf oauth expressions). Note: the crypto/noiseprotocol/protobuf/bthome bundles are core builds that require bitn on the path; include bitn alongside them (crypto also for noiseprotocol). oauth ships Control4's OAuth authorization-code grant (drivers-common-public module/auth_code_grant.lua) and its short-link helper (global/make_short_link.lua)."
  default: ""

cloud_diagnostics:
  type: bool
  help: "Ship lib.diagnostics (Cloud Monitoring): a DriverCentral build reports its memory use and errors to InfluxDB. Needs the INFLUXDB_URL, INFLUXDB_TOKEN, INFLUXDB_METRICS_DB and INFLUXDB_LOGS_DB build secrets."
  default: false

extra_build_secrets:
  type: str
  help: "Space-separated build secrets .env.default declares besides the template's own (SUPPORT_CODE_SECRET, and the four INFLUXDB_* with cloud_diagnostics). The Build workflow passes each to make build by name, and no other secret."
  default: ""
  validator: >-
    {% for name in extra_build_secrets.split() %}{% if not name | regex_search('^[A-Z_][A-Z0-9_]*$') %}{{ name }} is not a build secret name: use capital letters, digits and '_'. {% endif %}{% endfor %}

# Not asked: every build secret the Build workflow passes, the template's own first.
build_secrets:
  type: str
  when: false
  default: >-
    {{ (['SUPPORT_CODE_SECRET']
    + (['INFLUXDB_URL', 'INFLUXDB_TOKEN', 'INFLUXDB_METRICS_DB', 'INFLUXDB_LOGS_DB'] if cloud_diagnostics else [])
    + extra_build_secrets.split()) | unique | join(' ') }}

extra_required_checks:
  type: str
  help: "Space-separated status checks a pull request must pass besides build, each a job name from this repo's own workflows (e.g., 'catalogue'). tools/github-setup puts them in the branch ruleset."
  default: ""
  validator: >-
    {% for check in extra_required_checks.split() %}{% if not check | regex_search('^[A-Za-z0-9._-]+$') %}{{ check }} is not a check name tools/github-setup can require: use letters, digits, '.', '_' and '-'. {% endif %}{% endfor %}

stale_issues:
  type: bool
  help: "Ping inactive issues, then close them, unless an exempt author opened them"
  default: false

stale_exempt_authors:
  type: str
  help: "Space-separated GitHub logins whose issues are left alone, checked when an issue is opened or reopened. A GitHub App is name[bot] (e.g., 'octocat my-app[bot]'). Empty exempts no one."
  default: ""
  when: "{{ stale_issues }}"
  validator: >-
    {% for login in stale_exempt_authors.split() %}{% if not login | regex_search('^[A-Za-z0-9][A-Za-z0-9-]*(\\[bot\\])?$') %}{{ login }} is not a GitHub login. List a GitHub App as name[bot], not app/name. {% endif %}{% endfor %}

stale_days:
  type: int
  help: "Days without activity before an issue is pinged"
  default: 30
  when: "{{ stale_issues }}"
  validator: "{% if stale_days < 1 %}Must be at least 1{% endif %}"

stale_close_days:
  type: int
  help: "Days after the ping, still without activity, before the issue is closed"
  default: 14
  when: "{{ stale_issues }}"
  validator: "{% if stale_close_days < 1 %}Must be at least 1{% endif %}"
