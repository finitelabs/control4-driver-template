name: template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Main and tags group by run_id: a shared group would cancel their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  template-renders:
    name: template renders
    runs-on: ubuntu-26.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Into setup-python's interpreter, so tests/template_renders.py has copier and PyYAML.
      - name: Install copier
        run: pip install copier

      - name: List the template renders
        id: list
        run: echo "names=$(python3 tests/template_renders.py matrix)" >> "$GITHUB_OUTPUT"

  invalid:
    name: invalid combinations
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install copier
        run: pip install copier

      - name: Every combination in tests/template-renders/invalid fails to render
        run: make invalid-combinations

  render:
    name: render (${{ matrix.name }})
    needs: template-renders
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.template-renders.outputs.names) }}
    env:
      NAME: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install copier
        run: pip install copier

      - name: Render and check it
        run: make render-checks

  build:
    name: build (${{ matrix.name }})
    needs: template-renders
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.template-renders.outputs.names) }}
    env:
      NAME: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache stylua
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/stylua
          key: stylua-2.6.0-${{ runner.os }}-${{ runner.arch }}

      # GitHub's release download can answer 504 for a minute or more. The npm registry has the
      # same binary, published by StyLua's own release workflow.
      - name: Install stylua
        env:
          STYLUA: 2.6.0
        run: |
          dir="$RUNNER_TEMP/stylua"
          if [ ! -x "$dir/stylua" ]; then
            mkdir -p "$dir"
            arch=$(uname -m)
            fetch="curl -fsSL --retry 6 --retry-all-errors --connect-timeout 15 --max-time 60"
            if $fetch -o "$RUNNER_TEMP/stylua.zip" \
              "https://github.com/JohnnyMorganz/StyLua/releases/download/v$STYLUA/stylua-linux-$arch.zip"; then
              unzip -q "$RUNNER_TEMP/stylua.zip" -d "$dir"
            else
              npm=$([ "$arch" = aarch64 ] && echo arm64 || echo x64)
              $fetch "https://registry.npmjs.org/@johnnymorganz/stylua-bin-linux-$npm/-/stylua-bin-linux-$npm-$STYLUA.tgz" \
                | tar -xzO package/stylua > "$dir/stylua"
              chmod +x "$dir/stylua"
            fi
          fi
          version=$("$dir/stylua" --version)
          echo "$version"
          [ "$version" = "stylua $STYLUA" ]
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev libxslt-dev libssl-dev swig \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            fonts-dejavu-core fonts-liberation fonts-noto-core fonts-symbola

      - name: Install copier
        run: pip install copier

      - name: Render, then build the example driver in it and check it
        run: make build-checks
