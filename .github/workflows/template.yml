name: template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    name: render (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: ""
            diagnostics: false
            build_secrets: ""
          - name: oss-only
            distributions: oss
            readme_build: oss
            vendor_modules: ""
            diagnostics: false
            build_secrets: ""
          # No github-updater, version, or release workflow; has cloud-client-byte.
          - name: drivercentral-only
            distributions: drivercentral
            readme_build: drivercentral
            vendor_modules: ""
            diagnostics: false
            build_secrets: ""
          # version.lua ships on a non-oss build only when named.
          - name: version-token
            distributions: drivercentral
            readme_build: drivercentral
            vendor_modules: version
            diagnostics: false
            build_secrets: ""
          - name: crypto-bundles
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: bitn crypto noiseprotocol protobuf bthome
            diagnostics: false
            build_secrets: ""
          # Dual-distribution so the same file is exercised both as the real module
          # and as the stub it compiles down to for oss.
          - name: diagnostics
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: ""
            diagnostics: true
            build_secrets: INFLUXDB_URL INFLUXDB_TOKEN

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      # Installs stylua; it is run through a shell below, not this action, whose
      # arg splitter drops single-quoted globs and would check zero files.
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - name: Install copier
        run: pipx install copier

      # Without --vcs-ref HEAD copier renders the newest tag, not this checkout.
      - name: Render
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
          README_BUILD: ${{ matrix.readme_build }}
          VENDOR_MODULES: ${{ matrix.vendor_modules }}
          DIAGNOSTICS: ${{ matrix.diagnostics }}
          BUILD_SECRETS: ${{ matrix.build_secrets }}
        run: |
          copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-render \
            --data project_description="Template CI render" \
            --data github_org=finitelabs \
            --data readme_driver_slug=ci \
            --data distributions="$DISTRIBUTIONS" \
            --data readme_build="$README_BUILD" \
            --data vendor_modules="$VENDOR_MODULES" \
            --data diagnostics="$DIAGNOSTICS" \
            --data build_secrets="$BUILD_SECRETS" \
            . "$RUNNER_TEMP/render"

      # make test only loads modules that call a drivers-common-public global.
      - name: Every rendered src/lib module loads
        working-directory: ${{ runner.temp }}/render
        run: |
          LUA_PATH="$PWD/test/?.lua;$PWD/src/?.lua;$PWD/src/?/init.lua;$PWD/vendor/?.lua;$PWD/vendor/?/init.lua;;" \
          luajit -e '
            require("c4_shim")
            local failed = {}
            local p = io.popen("ls src/lib")
            for name in p:lines() do
              local mod = name:match("^(.*)%.lua$")
              if mod then
                local ok, err = pcall(require, "lib." .. mod)
                if not ok then
                  failed[#failed + 1] = mod .. ": " .. tostring(err)
                end
              end
            end
            p:close()
            if #failed > 0 then
              io.stderr:write("modules that do not load:\n  " .. table.concat(failed, "\n  ") .. "\n")
              os.exit(1)
            end
            print("every src/lib module loads")
          '

      # test_c4_shim.lua skips its crypto assertions when no FFI backend loads,
      # so on a runner without one `make test` would go green having tested
      # nothing. The template is where that mock is developed, so require the
      # backend here; driver repos keep the skip.
      - name: The FFI crypto backend resolves
        working-directory: ${{ runner.temp }}/render
        run: |
          LUA_PATH="$PWD/test/?.lua;$PWD/src/?.lua;$PWD/src/?/init.lua;$PWD/vendor/?.lua;$PWD/vendor/?/init.lua;;" \
          luajit -e '
            require("c4_shim")
            if not C4.SHIM_HAS_CRYPTO then
              io.stderr:write("no FFI crypto backend: the c4_shim crypto assertions would have skipped\n")
              os.exit(1)
            end
            print("FFI crypto backend resolved")
          '

      - name: make test
        working-directory: ${{ runner.temp }}/render
        run: make test

      # Both branches of diagnostics.lua are present in the raw file, so it has to be
      # the real one that a non-preprocessed load reaches. Nothing else in the suite
      # distinguishes them: the stub answers the whole public surface.
      - name: A raw load of lib.diagnostics gets the real module, not the stub
        if: matrix.name == 'diagnostics'
        working-directory: ${{ runner.temp }}/render
        run: |
          LUA_PATH="$PWD/test/?.lua;$PWD/src/?.lua;$PWD/src/?/init.lua;$PWD/vendor/?.lua;$PWD/vendor/?/init.lua;;" \
          luajit -e '
            require("c4_shim")
            local diagnostics = require("lib.diagnostics")
            if rawget(diagnostics, "_censusInterval") == nil then
              io.stderr:write("a raw load reached the stub branch, not the real module\n")
              os.exit(1)
            end
            print("raw load executes the DRIVERCENTRAL branch")
          '

      - name: Build secrets resolve, and an unresolved one fails the build
        if: matrix.name == 'diagnostics'
        working-directory: ${{ runner.temp }}/render
        run: |
          # preprocess.py copytrees drivers/ unconditionally; a bare render has none.
          mkdir -p drivers

          # oss strips the branch holding the placeholders, so it needs no secrets.
          ./tools/preprocess.py --oss

          if output=$(./tools/preprocess.py --drivercentral 2>&1); then
            echo "::error::drivercentral built with no secrets set"
            exit 1
          fi
          echo "$output" | grep -q 'src/lib/diagnostics.lua: INFLUXDB_TOKEN' || {
            echo "::error::the failure did not name the file and variable"
            echo "$output"
            exit 1
          }

          INFLUXDB_URL=https://example.invalid INFLUXDB_TOKEN=dummy ./tools/preprocess.py --drivercentral

          # Matches a whole placeholder, not the bare prefix: the module's runtime guard
          # contains the prefix as a literal and a looser pattern flags that line.
          if grep -RE '%%SECRET:[A-Za-z_][A-Za-z0-9_]*%%' build/; then
            echo "::error::a placeholder survived into the build output"
            exit 1
          fi

          grep -q 'secrets.INFLUXDB_TOKEN' .github/workflows/build.yml || {
            echo "::error::build.yml is missing the secrets env block"
            exit 1
          }

      - name: Without the answer there is no diagnostics module and no secrets env block
        if: matrix.name != 'diagnostics'
        working-directory: ${{ runner.temp }}/render
        run: |
          if [ -e src/lib/diagnostics.lua ]; then
            echo "::error::diagnostics.lua rendered without being asked for"
            exit 1
          fi
          if grep -q 'secrets.INFLUXDB' .github/workflows/build.yml; then
            echo "::error::build.yml carries a secrets env block with no build_secrets"
            exit 1
          fi

      - name: Formatted
        working-directory: ${{ runner.temp }}/render
        run: |
          stylua --check \
            --indent-type Spaces --column-width 120 --line-endings Unix \
            --indent-width 2 --quote-style AutoPreferDouble \
            src test tools vendor
          pipx run black --check tools
          pipx run --spec 'mdformat' --spec 'mdformat-gfm' mdformat --check --wrap 80 *.md

  # A render has no driver, so `make build` would build nothing. example-driver/
  # (repo root, outside template/, so copier never renders it) supplies one.
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            distributions: drivercentral oss
            vendor_modules: ""
          - name: crypto-bundles
            distributions: drivercentral oss
            vendor_modules: bitn crypto noiseprotocol protobuf bthome

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev libxslt-dev libssl-dev swig \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi-dev fonts-dejavu-core fonts-liberation fonts-noto-core fonts-symbola

      - name: Install copier
        run: pipx install copier

      - name: Render
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
          VENDOR_MODULES: ${{ matrix.vendor_modules }}
        run: |
          copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-render \
            --data project_description="Template CI render" \
            --data github_org=finitelabs \
            --data readme_driver_slug=example \
            --data distributions="$DISTRIBUTIONS" \
            --data readme_build=oss \
            --data vendor_modules="$VENDOR_MODULES" \
            . "$RUNNER_TEMP/render"

      - name: Add example driver
        run: cp -r example-driver/drivers "$RUNNER_TEMP/render/drivers"

      - name: Initialize project (make init)
        working-directory: ${{ runner.temp }}/render
        run: make init

      - name: Check formatting (make check)
        working-directory: ${{ runner.temp }}/render
        run: make check

      - name: Test (make test)
        working-directory: ${{ runner.temp }}/render
        run: make test

      # Build, commit, build again: a dirty tree on the second build means
      # `make build` is not idempotent.
      - name: Build is idempotent (make build)
        working-directory: ${{ runner.temp }}/render
        run: |
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          make build
          git add -A
          git commit -q -m "first build"
          make build
          git diff --exit-code || {
            echo "::error::make build is not idempotent (tracked files changed on rebuild)"
            exit 1
          }
          UNTRACKED=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked files after rebuild:"
            echo "$UNTRACKED"
            exit 1
          fi
