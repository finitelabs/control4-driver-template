name: template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Main and tags group by run_id: a shared group would cancel their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    name: render (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: ""
          - name: oss-only
            distributions: oss
            readme_build: oss
            vendor_modules: ""
          # No github-updater, version, or release workflow; has cloud-client-byte.
          - name: drivercentral-only
            distributions: drivercentral
            readme_build: drivercentral
            vendor_modules: ""
          # version.lua ships on a non-oss build only when named.
          - name: version-token
            distributions: drivercentral
            readme_build: drivercentral
            vendor_modules: version
          - name: crypto-bundles
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: bitn crypto noiseprotocol protobuf bthome
          - name: oauth
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: oauth
          # stale.yml renders only with stale_issues; every other leg checks it is absent.
          - name: stale-issues
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: ""
            stale_issues: true
            stale_exempt_authors: octocat ci-app[bot]
            stale_days: 45
            stale_close_days: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - name: Install stylua
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-$(uname -m).zip"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stylua/stylua" --version

      - name: Install copier
        run: pipx install copier

      # Without --vcs-ref HEAD copier renders the newest tag, not this checkout.
      - name: Render
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
          README_BUILD: ${{ matrix.readme_build }}
          VENDOR_MODULES: ${{ matrix.vendor_modules }}
          STALE_ISSUES: ${{ matrix.stale_issues }}
          STALE_EXEMPT_AUTHORS: ${{ matrix.stale_exempt_authors }}
          STALE_DAYS: ${{ matrix.stale_days }}
          STALE_CLOSE_DAYS: ${{ matrix.stale_close_days }}
        run: |
          stale=()
          if [ "$STALE_ISSUES" = true ]; then
            stale=(--data stale_issues=true
              --data stale_exempt_authors="$STALE_EXEMPT_AUTHORS"
              --data stale_days="$STALE_DAYS"
              --data stale_close_days="$STALE_CLOSE_DAYS")
          fi
          copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-render \
            --data project_description="Template CI render" \
            --data github_org=finitelabs \
            --data readme_driver_slug=ci \
            --data distributions="$DISTRIBUTIONS" \
            --data readme_build="$README_BUILD" \
            --data vendor_modules="$VENDOR_MODULES" \
            "${stale[@]}" \
            . "$RUNNER_TEMP/render"

      # An empty exempt list has to render fromJSON('[]'), so it gets a render of its own.
      - name: stale.yml renders only when asked, with the exempt list as JSON
        working-directory: ${{ runner.temp }}/render
        env:
          STALE_ISSUES: ${{ matrix.stale_issues }}
          STALE_EXEMPT_AUTHORS: ${{ matrix.stale_exempt_authors }}
          STALE_DAYS: ${{ matrix.stale_days }}
          STALE_CLOSE_DAYS: ${{ matrix.stale_close_days }}
        run: |
          f=.github/workflows/stale.yml
          if [ "$STALE_ISSUES" != true ]; then
            if [ -e "$f" ]; then echo "::error::$f rendered with stale_issues off"; exit 1; fi
            echo "no $f, as stale_issues is off"
            exit 0
          fi
          check() {
            local cond list got
            cond=$(yq -e '.jobs["label-external"].if' "$1") \
              || { echo "::error::$1 is not YAML with a label-external if"; exit 1; }
            list=$(sed -n "s/.*fromJSON('\(.*\)').*/\1/p" <<<"$cond")
            got=$(jq -c . <<<"$list") || { echo "::error::$1 exempt list $list is not JSON"; exit 1; }
            [ "$got" = "$2" ] || { echo "::error::$1 exempts $got, want $2"; exit 1; }
            if grep -nE '\{%|\{#|(^|[^$])\{\{' "$1"; then echo "::error::$1 has unrendered Jinja"; exit 1; fi
            echo "$1 exempts $got"
          }
          check "$f" "$(jq -cn --arg s "$STALE_EXEMPT_AUTHORS" '$s | split(" ")')"
          yq -e '.jobs.stale.steps[0].with."days-before-issue-stale" == env(STALE_DAYS) and .jobs.stale.steps[0].with."days-before-issue-close" == env(STALE_CLOSE_DAYS)' "$f" > /dev/null \
            || { echo "::error::$f does not use stale_days $STALE_DAYS and stale_close_days $STALE_CLOSE_DAYS"; exit 1; }
          copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-render \
            --data github_org=finitelabs \
            --data readme_driver_slug=ci \
            --data stale_issues=true \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/render-empty"
          check "$RUNNER_TEMP/render-empty/$f" '[]'

      - name: tools/github-setup is rendered and executable
        working-directory: ${{ runner.temp }}/render
        run: test -x tools/github-setup && grep -qx 'NAME=ci-render' tools/github-setup

      - name: Rendered uploads expire
        working-directory: ${{ runner.temp }}/render
        run: |
          f=.github/workflows/build.yml
          uploads=$(grep -c 'uses: actions/upload-artifact' "$f" || true)
          expiring=$(grep -c 'retention-days:' "$f" || true)
          tag=$(grep 'retention-days:' "$f" | grep -cF "github.ref_type == 'tag' && 14" || true)
          pr=$(grep 'retention-days:' "$f" | grep -cF "github.event_name == 'pull_request' && 1" || true)
          other=$(grep 'retention-days:' "$f" | grep -cF '|| 3 }}' || true)
          echo "upload steps: $uploads, retention-days: $expiring, naming tag: $tag, pull request: $pr, otherwise: $other"
          for n in "$expiring" "$tag" "$pr" "$other"; do
            if [ "$uploads" -eq 0 ] || [ "$n" -ne "$uploads" ]; then
              echo "::error::every actions/upload-artifact step in build.yml needs retention-days naming the tag, pull request and otherwise cases"
              exit 1
            fi
          done

      # make test only loads modules that call a drivers-common-public global.
      - name: Every rendered src/lib module loads
        working-directory: ${{ runner.temp }}/render
        run: |
          LUA_PATH="$PWD/test/?.lua;$PWD/src/?.lua;$PWD/src/?/init.lua;$PWD/vendor/?.lua;$PWD/vendor/?/init.lua;;" \
          luajit -e '
            require("c4_shim")
            local failed = {}
            local p = io.popen("ls src/lib")
            for name in p:lines() do
              local mod = name:match("^(.*)%.lua$")
              if mod then
                local ok, err = pcall(require, "lib." .. mod)
                if not ok then
                  failed[#failed + 1] = mod .. ": " .. tostring(err)
                end
              end
            end
            p:close()
            if #failed > 0 then
              io.stderr:write("modules that do not load:\n  " .. table.concat(failed, "\n  ") .. "\n")
              os.exit(1)
            end
            print("every src/lib module loads")
          '

      # test_c4_shim.lua skips its crypto assertions when no FFI backend loads,
      # so on a runner without one `make test` would go green having tested
      # nothing. The template is where that mock is developed, so require the
      # backend here; driver repos keep the skip.
      - name: The FFI crypto backend resolves
        working-directory: ${{ runner.temp }}/render
        run: |
          LUA_PATH="$PWD/test/?.lua;$PWD/src/?.lua;$PWD/src/?/init.lua;$PWD/vendor/?.lua;$PWD/vendor/?/init.lua;;" \
          luajit -e '
            require("c4_shim")
            if not C4.SHIM_HAS_CRYPTO then
              io.stderr:write("no FFI crypto backend: the c4_shim crypto assertions would have skipped\n")
              os.exit(1)
            end
            print("FFI crypto backend resolved")
          '

      - name: make test
        working-directory: ${{ runner.temp }}/render
        run: make test

      - name: Build secrets are substituted
        if: matrix.name == 'default'
        working-directory: ${{ runner.temp }}/render
        run: |
          set -euo pipefail
          mkdir -p drivers/probe
          printf 'A="__CI_SECRET_A__" B="__CI_SECRET_B__" D="__CI_SECRET_D__"\n' > drivers/probe/driver.lua
          printf '# CI probe\nCI_SECRET_A=\nCI_SECRET_B=\nCI_SECRET_D=\n' > .env.default
          printf 'CI_SECRET_A=from-dotenv\n' > .env
          SECRETS_JSON='{"CI_SECRET_B":"from-dotenv","GITHUB_TOKEN":"not-declared"}' \
            python3 tools/preprocess.py --write-dotenv
          if grep -q GITHUB_TOKEN .env; then echo "::error::an undeclared secret reached .env"; exit 1; fi
          out=$(CI_SECRET_A=from-env python3 tools/preprocess.py --oss)
          got=$(cat build/oss/drivers/probe/driver.lua)
          want='A="from-env" B="from-dotenv" D=""'
          [ "$got" = "$want" ] || { echo "::error::got $got, want $want"; exit 1; }
          if grep -q 'from-' <<<"$out"; then echo "::error::a value was printed"; exit 1; fi
          grep -q 'CI_SECRET_D is not set' <<<"$out"
          if REQUIRE_SECRETS=1 python3 tools/preprocess.py --oss >/dev/null 2>&1; then
            echo "::error::REQUIRE_SECRETS passed with CI_SECRET_D missing"; exit 1
          fi
          grep -qx '/.env' .gitignore
          rm -rf drivers/probe build .env .env.default

      - name: Formatted
        working-directory: ${{ runner.temp }}/render
        run: |
          stylua --check \
            --indent-type Spaces --column-width 120 --line-endings Unix \
            --indent-width 2 --quote-style AutoPreferDouble \
            src test tools vendor
          pipx run black --check tools
          pipx run --spec 'mdformat' --spec 'mdformat-gfm' mdformat --check --wrap 80 *.md

  # A render has no driver, so `make build` would build nothing. example-driver/
  # (repo root, outside template/, so copier never renders it) supplies one.
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            distributions: drivercentral oss
            vendor_modules: ""
            readme_driver_slug: example
            variants: ""
          - name: crypto-bundles
            distributions: drivercentral oss
            vendor_modules: bitn crypto noiseprotocol protobuf bthome
            readme_driver_slug: example
            variants: ""
          - name: oauth
            distributions: drivercentral oss
            vendor_modules: oauth
            readme_driver_slug: example
            variants: ""
          # The README driver is a generated variant: build/ has
          # drivers/example_variant, and drivers/ has no such folder.
          - name: variant-readme
            distributions: drivercentral oss
            vendor_modules: ""
            readme_driver_slug: example_variant
            variants: '{"variants": [{"suffix": "variant"}]}'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install stylua
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-$(uname -m).zip"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stylua/stylua" --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev libxslt-dev libssl-dev swig \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            fonts-dejavu-core fonts-liberation fonts-noto-core fonts-symbola

      - name: Install copier
        run: pipx install copier

      - name: Render
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
          VENDOR_MODULES: ${{ matrix.vendor_modules }}
          README_DRIVER_SLUG: ${{ matrix.readme_driver_slug }}
        run: |
          copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-render \
            --data project_description="Template CI render" \
            --data github_org=finitelabs \
            --data readme_driver_slug="$README_DRIVER_SLUG" \
            --data distributions="$DISTRIBUTIONS" \
            --data readme_build=oss \
            --data vendor_modules="$VENDOR_MODULES" \
            . "$RUNNER_TEMP/render"

      - name: Add example driver
        env:
          VARIANTS: ${{ matrix.variants }}
        run: |
          cp -r example-driver/drivers "$RUNNER_TEMP/render/drivers"
          if [ -n "$VARIANTS" ]; then
            printf '%s\n' "$VARIANTS" > "$RUNNER_TEMP/render/drivers/example/variants.json"
          fi

      - name: Initialize project (make init)
        working-directory: ${{ runner.temp }}/render
        run: make init

      - name: Check formatting (make check)
        working-directory: ${{ runner.temp }}/render
        run: make check

      - name: Test (make test)
        working-directory: ${{ runner.temp }}/render
        run: make test

      # Build, commit, build again: a dirty tree on the second build means
      # `make build` is not idempotent.
      - name: Build is idempotent (make build)
        working-directory: ${{ runner.temp }}/render
        run: |
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          make build
          git add -A
          git commit -q -m "first build"
          make build
          git diff --exit-code || {
            echo "::error::make build is not idempotent (tracked files changed on rebuild)"
            exit 1
          }
          UNTRACKED=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked files after rebuild:"
            echo "$UNTRACKED"
            exit 1
          fi

      # A README image that docs-readme failed to copy breaks nothing else in
      # the build, so check every link resolves.
      - name: README images resolve
        working-directory: ${{ runner.temp }}/render
        run: |
          refs=$(grep -oE '\./images/[^")[:space:]]+' README.md | sort -u)
          if [ -z "$refs" ]; then
            echo "::error::README.md links no images, so this check tests nothing"
            exit 1
          fi
          missing=0
          for ref in $refs; do
            if [ ! -f "$ref" ]; then
              echo "::error::README.md links $ref, which does not exist"
              missing=1
            fi
          done
          exit "$missing"

      - name: A build with secrets is encrypted
        if: matrix.name == 'oauth'
        working-directory: ${{ runner.temp }}/render
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
        run: |
          set -euo pipefail
          printf '# CI probe\nEXAMPLE_SECRET=\n' > .env.default
          printf '\nEXAMPLE_BUILD_SECRET = "__EXAMPLE_SECRET__"\n' >> drivers/example/driver.lua
          EXAMPLE_SECRET=ci-secret-value make build-nodocs
          for build in $DISTRIBUTIONS; do
            for c4z in "dist/$build/c4z"/*.c4z; do
              unzip -l "$c4z" | grep -q 'driver\.lua\.encrypted' \
                || { echo "::error::$c4z has no driver.lua.encrypted"; exit 1; }
              unzip -p "$c4z" driver.xml | grep -q 'encryption="2"' \
                || { echo "::error::$c4z driver.xml does not ask for encryption"; exit 1; }
              if unzip -p "$c4z" | grep -aq ci-secret-value; then
                echo "::error::$c4z holds the secret in plain text"; exit 1
              fi
            done
            if [ -e "dist/$build/source" ]; then
              echo "::error::dist/$build/source was kept with a secret in it"; exit 1
            fi
          done
          git checkout -- drivers/example/driver.lua
          rm .env.default
