name: template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Main and tags group by run_id: a shared group would cancel their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  template-renders:
    name: template renders
    runs-on: ubuntu-26.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Into setup-python's interpreter, so tests/template_renders.py has copier and PyYAML.
      - name: Install copier
        run: pip install copier

      - name: List the template renders
        id: list
        run: echo "names=$(python3 tests/template_renders.py matrix)" >> "$GITHUB_OUTPUT"

  invalid:
    name: invalid combinations
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install copier
        run: pip install copier

      - name: Every combination in tests/template-renders/invalid fails to render
        run: make invalid-combinations

  render:
    name: render (${{ matrix.name }})
    needs: template-renders
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.template-renders.outputs.names) }}
    env:
      NAME: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - name: Install stylua
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-$(uname -m).zip"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stylua/stylua" --version

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install copier
        run: pip install copier

      - name: Render
        run: make render

      - name: The render matches its snapshot
        run: make render-snapshot

      - name: Every rendered src/lib module loads
        run: make render-lib-loads

      - name: The FFI crypto backend resolves
        run: make render-crypto

      - name: Test (make test)
        run: make in-render-test

      - name: Formatted
        run: make render-formatted

  build:
    name: build (${{ matrix.name }})
    needs: template-renders
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.template-renders.outputs.names) }}
    env:
      NAME: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install stylua
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-$(uname -m).zip"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stylua/stylua" --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev libxslt-dev libssl-dev swig \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            fonts-dejavu-core fonts-liberation fonts-noto-core fonts-symbola

      - name: Install copier
        run: pip install copier

      - name: Render
        run: make render

      - name: Add example driver
        run: make render-example

      - name: Initialize project (make init)
        run: make in-render-init

      - name: Check formatting (make check)
        run: make in-render-check

      - name: Test (make test)
        run: make in-render-test

      - name: Build is idempotent (make build)
        run: make build-idempotent

      - name: README images resolve
        run: make build-readme-images

      - name: A build with secrets is encrypted
        run: make build-encrypted

      - name: Cloud Monitoring reaches only the DriverCentral build
        run: make build-cloud-monitoring
