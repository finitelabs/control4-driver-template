name: template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Main and tags group by run_id: a shared group would cancel their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    name: render (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: ""
          - name: oss-only
            distributions: oss
            readme_build: oss
            vendor_modules: ""
          # No github-updater, version, or release workflow; has cloud-client-byte.
          - name: drivercentral-only
            distributions: drivercentral
            readme_build: drivercentral
            vendor_modules: ""
          # version.lua ships on a non-oss build only when named.
          - name: version-token
            distributions: drivercentral
            readme_build: drivercentral
            vendor_modules: version
          - name: crypto-bundles
            distributions: drivercentral oss
            readme_build: oss
            vendor_modules: bitn crypto noiseprotocol protobuf bthome

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      # Installs stylua; it is run through a shell below, not this action, whose
      # arg splitter drops single-quoted globs and would check zero files.
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - name: Install copier
        run: pipx install copier

      # Without --vcs-ref HEAD copier renders the newest tag, not this checkout.
      - name: Render
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
          README_BUILD: ${{ matrix.readme_build }}
          VENDOR_MODULES: ${{ matrix.vendor_modules }}
        run: |
          copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-render \
            --data project_description="Template CI render" \
            --data github_org=finitelabs \
            --data readme_driver_slug=ci \
            --data distributions="$DISTRIBUTIONS" \
            --data readme_build="$README_BUILD" \
            --data vendor_modules="$VENDOR_MODULES" \
            . "$RUNNER_TEMP/render"

      - name: tools/github-setup is rendered and executable
        working-directory: ${{ runner.temp }}/render
        run: test -x tools/github-setup && grep -qx 'NAME=ci-render' tools/github-setup

      - name: Rendered uploads expire
        working-directory: ${{ runner.temp }}/render
        run: |
          f=.github/workflows/build.yml
          uploads=$(grep -c 'uses: actions/upload-artifact' "$f" || true)
          expiring=$(grep -c 'retention-days:' "$f" || true)
          tag=$(grep 'retention-days:' "$f" | grep -cF "github.ref_type == 'tag' && 14" || true)
          pr=$(grep 'retention-days:' "$f" | grep -cF "github.event_name == 'pull_request' && 1" || true)
          other=$(grep 'retention-days:' "$f" | grep -cF '|| 3 }}' || true)
          echo "upload steps: $uploads, retention-days: $expiring, naming tag: $tag, pull request: $pr, otherwise: $other"
          for n in "$expiring" "$tag" "$pr" "$other"; do
            if [ "$uploads" -eq 0 ] || [ "$n" -ne "$uploads" ]; then
              echo "::error::every actions/upload-artifact step in build.yml needs retention-days naming the tag, pull request and otherwise cases"
              exit 1
            fi
          done

      # make test only loads modules that call a drivers-common-public global.
      - name: Every rendered src/lib module loads
        working-directory: ${{ runner.temp }}/render
        run: |
          LUA_PATH="$PWD/test/?.lua;$PWD/src/?.lua;$PWD/src/?/init.lua;$PWD/vendor/?.lua;$PWD/vendor/?/init.lua;;" \
          luajit -e '
            require("c4_shim")
            local failed = {}
            local p = io.popen("ls src/lib")
            for name in p:lines() do
              local mod = name:match("^(.*)%.lua$")
              if mod then
                local ok, err = pcall(require, "lib." .. mod)
                if not ok then
                  failed[#failed + 1] = mod .. ": " .. tostring(err)
                end
              end
            end
            p:close()
            if #failed > 0 then
              io.stderr:write("modules that do not load:\n  " .. table.concat(failed, "\n  ") .. "\n")
              os.exit(1)
            end
            print("every src/lib module loads")
          '

      # test_c4_shim.lua skips its crypto assertions when no FFI backend loads,
      # so on a runner without one `make test` would go green having tested
      # nothing. The template is where that mock is developed, so require the
      # backend here; driver repos keep the skip.
      - name: The FFI crypto backend resolves
        working-directory: ${{ runner.temp }}/render
        run: |
          LUA_PATH="$PWD/test/?.lua;$PWD/src/?.lua;$PWD/src/?/init.lua;$PWD/vendor/?.lua;$PWD/vendor/?/init.lua;;" \
          luajit -e '
            require("c4_shim")
            if not C4.SHIM_HAS_CRYPTO then
              io.stderr:write("no FFI crypto backend: the c4_shim crypto assertions would have skipped\n")
              os.exit(1)
            end
            print("FFI crypto backend resolved")
          '

      - name: make test
        working-directory: ${{ runner.temp }}/render
        run: make test

      - name: Formatted
        working-directory: ${{ runner.temp }}/render
        run: |
          stylua --check \
            --indent-type Spaces --column-width 120 --line-endings Unix \
            --indent-width 2 --quote-style AutoPreferDouble \
            src test tools vendor
          pipx run black --check tools
          pipx run --spec 'mdformat' --spec 'mdformat-gfm' mdformat --check --wrap 80 *.md

  # A render has no driver, so `make build` would build nothing. example-driver/
  # (repo root, outside template/, so copier never renders it) supplies one.
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            distributions: drivercentral oss
            vendor_modules: ""
            readme_driver_slug: example
            variants: ""
          - name: crypto-bundles
            distributions: drivercentral oss
            vendor_modules: bitn crypto noiseprotocol protobuf bthome
            readme_driver_slug: example
            variants: ""
          # The README driver is a generated variant: build/ has
          # drivers/example_variant, and drivers/ has no such folder.
          - name: variant-readme
            distributions: drivercentral oss
            vendor_modules: ""
            readme_driver_slug: example_variant
            variants: '{"variants": [{"suffix": "variant"}]}'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev libxslt-dev libssl-dev swig \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            fonts-dejavu-core fonts-liberation fonts-noto-core fonts-symbola

      - name: Install copier
        run: pipx install copier

      - name: Render
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
          VENDOR_MODULES: ${{ matrix.vendor_modules }}
          README_DRIVER_SLUG: ${{ matrix.readme_driver_slug }}
        run: |
          copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-render \
            --data project_description="Template CI render" \
            --data github_org=finitelabs \
            --data readme_driver_slug="$README_DRIVER_SLUG" \
            --data distributions="$DISTRIBUTIONS" \
            --data readme_build=oss \
            --data vendor_modules="$VENDOR_MODULES" \
            . "$RUNNER_TEMP/render"

      - name: Add example driver
        env:
          VARIANTS: ${{ matrix.variants }}
        run: |
          cp -r example-driver/drivers "$RUNNER_TEMP/render/drivers"
          if [ -n "$VARIANTS" ]; then
            printf '%s\n' "$VARIANTS" > "$RUNNER_TEMP/render/drivers/example/variants.json"
          fi

      - name: Initialize project (make init)
        working-directory: ${{ runner.temp }}/render
        run: make init

      - name: Check formatting (make check)
        working-directory: ${{ runner.temp }}/render
        run: make check

      - name: Test (make test)
        working-directory: ${{ runner.temp }}/render
        run: make test

      # Build, commit, build again: a dirty tree on the second build means
      # `make build` is not idempotent.
      - name: Build is idempotent (make build)
        working-directory: ${{ runner.temp }}/render
        run: |
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          make build
          git add -A
          git commit -q -m "first build"
          make build
          git diff --exit-code || {
            echo "::error::make build is not idempotent (tracked files changed on rebuild)"
            exit 1
          }
          UNTRACKED=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked files after rebuild:"
            echo "$UNTRACKED"
            exit 1
          fi

      # A README image that docs-readme failed to copy breaks nothing else in
      # the build, so check every link resolves.
      - name: README images resolve
        working-directory: ${{ runner.temp }}/render
        run: |
          refs=$(grep -oE '\./images/[^")[:space:]]+' README.md | sort -u)
          if [ -z "$refs" ]; then
            echo "::error::README.md links no images, so this check tests nothing"
            exit 1
          fi
          missing=0
          for ref in $refs; do
            if [ ! -f "$ref" ]; then
              echo "::error::README.md links $ref, which does not exist"
              missing=1
            fi
          done
          exit "$missing"

      # The example doc has one of each GitHub alert, a list, link and code in
      # the tip, and a plain quote. `make check` covers the doc's own markers.
      - name: Alerts render as GitHub renders them
        working-directory: ${{ runner.temp }}/render
        run: |
          failed=0
          for kind in note tip important warning caution; do
            if ! grep -qxF "> [!${kind^^}]" README.md; then
              echo "::error::README.md has no [!${kind^^}] marker on a line of its own"
              failed=1
            fi
          done
          for html in build/oss/drivers/*/www/documentation/index.html; do
            for kind in note tip important warning caution; do
              if ! grep -qF "<div class=\"markdown-alert markdown-alert-$kind\">" "$html" ||
                ! grep -qE "<p class=\"markdown-alert-title\"><svg class=\"octicon [^>]*>.*</svg>${kind^}</p>" "$html"; then
                echo "::error::$html has no ${kind^} alert"
                failed=1
              fi
            done
            tip=$(sed -n '/<div class="markdown-alert markdown-alert-tip">/,/^<\/div>$/p' "$html")
            for want in '<ol>' '<strong>Log Level</strong>' '<code>5 - Trace</code>' '<a href="#support">'; do
              if ! grep -qF "$want" <<<"$tip"; then
                echo "::error::the tip alert in $html lost $want"
                failed=1
              fi
            done
            if ! grep -qx '<blockquote>' "$html" || grep -qF '[!' "$html"; then
              echo "::error::$html lost its plain quote, or shows an alert marker as text"
              failed=1
            fi
          done
          # A tab after a marker, which the example doc cannot carry: fmt drops it.
          printf '> [!NOTE]\t\n> Tab after the marker.\n' >"$RUNNER_TEMP/tab.md"
          .venv/bin/python3 tools/docs.py md2html "$RUNNER_TEMP/tab.md" "$RUNNER_TEMP/tab"
          .venv/bin/python3 tools/docs.py fmt --wrap 80 "$RUNNER_TEMP/tab.md"
          if ! grep -qF '<div class="markdown-alert markdown-alert-note">' "$RUNNER_TEMP/tab/index.html" ||
            ! grep -qxF '> [!NOTE]' "$RUNNER_TEMP/tab.md"; then
            echo "::error::a tab after an alert marker loses the alert"
            failed=1
          fi
          exit "$failed"
